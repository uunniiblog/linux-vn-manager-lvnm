name: Build lvnm AppImage

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Required to create releases

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2
          pip install PySide6 setproctitle requests pyinstaller
          # Add any other requirements from your requirements.txt if needed
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Create AppDir Structure
        run: |
          mkdir -p LVNM.AppDir/usr/bin/tools
          mkdir -p LVNM.AppDir/usr/share/applications
          mkdir -p LVNM.AppDir/usr/share/icons/hicolor/256x256/apps

      - name: Bundle GStreamer Libraries and Deep Codecs
        run: |
          mkdir -p gst-downloads
          cd gst-downloads
          
          sudo apt-get update
          sudo apt-get install -y apt-file
          sudo apt-file upda

          # Download GStreamer
          apt-get download \
            libgstreamer1.0-0 libgstreamer-plugins-base1.0-0 \
            libgstreamer-plugins-good1.0-0 libgstreamer-plugins-bad1.0-0 \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav gstreamer1.0-tools liborc-0.4-0

          apt-get download \
            libicu70 libbluray2 libdc1394-25 libflite1 libtheora0 \
            libopenexr25 libmpeg2-4 libmjpegutils-2.1-0 libvpx7 \
            libx264-163 libx265-199 libmp3lame0 libmpg123-0 libkate1

          apt-get download \
            libncurses6 \
            libdav1d5 \
            libxml2 \
            libpocketsphinx3 \
            libilmbase25 \
            libtiff5 \
            libgupnp-igd-1.0-4 \
            libavcodec-extra58 \
            libncurses6 \
            libsphinxbase3 \
            libjbig0 \
            libgupnp-1.2-1 \
            libpcre3
          
          for deb in *.deb; do dpkg -x "$deb" . ; done
          
          # Try to find what the GStreamer plugins are strictly missing
          echo "Finding missing dependencies for GStreamer plugins..."
          BUNDLED_LIBS=$(find usr/lib/x86_64-linux-gnu -name "*.so*" -printf "%f\n" | sort -u)
          MISSING_FILES=$(
            find usr/lib/x86_64-linux-gnu/gstreamer-1.0 -name "*.so" | while read plugin; do
              readelf -d "$plugin" 2>/dev/null | grep NEEDED | grep -oP '\[\K[^\]]+' 
            done | sort -u | while read needed; do
              # Check if it exists in our bundle (match by prefix since versions vary)
              base="${needed%.so*}"
              if ! echo "$BUNDLED_LIBS" | grep -q "^${base}"; then
                echo "$needed"
              fi
            done
          )

          if [ -n "$MISSING_FILES" ]; then
            echo "Missing files: $MISSING_FILES"
            for file in $MISSING_FILES; do
              PKG=$(apt-file search "$file" | grep "x86_64-linux-gnu\|amd64" | head -n 1 | cut -d: -f1)
              if [ -n "$PKG" ]; then
                echo "Downloading $PKG to satisfy $file..."
                apt-get download "$PKG" || true
              fi
            done
            # Second extraction pass for anything newly downloaded
            for deb in *.deb; do dpkg -x "$deb" . ; done
          fi
          # Move to AppDir
          cp -r usr ../LVNM.AppDir/
          cd ..
          
          # Clean 
          echo "Cleaning up dangerous system libraries..."
          cd LVNM.AppDir/usr/lib/x86_64-linux-gnu
          
          # Remove things that break Python and core OS functions
          rm -f libzstd.so* libresolv.so* libcrypt.so*
          rm -f libexpat.so* libssl.so* libcrypto.so* libsqlite3.so*
          
          # Remove core drivers to prevent conflicts
          rm -f libGL.so* libEGL.so* libGLX.so* libGLdispatch.so* libgbm.so*
          rm -f libX11.so* libX11-xcb.so* libxcb.so* libdrm.so*
          rm -f libasound.so* libjack.so* libpulse.so*

          # Remove 32 bit
          find LVNM.AppDir/usr/lib/i386-linux-gnu -type f -delete 2>/dev/null || true
          find LVNM.AppDir/usr/lib32 -type f -delete 2>/dev/null || true
          find LVNM.AppDir/usr/lib -name "*.so*" | xargs file 2>/dev/null | grep "ELF 32-bit" | cut -d: -f1 | xargs rm -f 2>/dev/null || true
          
          echo "Final library count: $(ls | wc -l)"
          echo "GStreamer bundling complete."

      - name: Build Main LVNM Binary
        run: |
          python -m PyInstaller --noconfirm --windowed \
            --paths . \
            --paths lvnm \
            --add-data "lvnm/vn_winestuff:vn_winestuff" \
            --name LVNM lvnm/launcher.py
          # Move it immediately to avoid collision
          cp -r dist/LVNM/* LVNM.AppDir/usr/bin/
          # Avoid library errors
          rm -f LVNM.AppDir/usr/bin/libreadline.so*
          rm -f LVNM.AppDir/usr/bin/libtinfo.so*

      - name: Bundle umu-run (Latest Stable Zipapp)
        run: |
          # Query GitHub API for the latest non-prerelease
          DOWNLOAD_URL=$(curl -s https://api.github.com/repos/Open-Wine-Components/umu-launcher/releases | \
            jq -r '[.[] | select(.prerelease == false)][0].assets[] | select(.name | contains("zipapp.tar")) | .browser_download_url')
          
          echo "Downloading umu-run from: $DOWNLOAD_URL"
          curl -fL -o umu-zipapp.tar "$DOWNLOAD_URL"
          
          tar -xf umu-zipapp.tar
          cp umu/umu-run LVNM.AppDir/usr/bin/tools/umu-run
          chmod +x LVNM.AppDir/usr/bin/tools/umu-run

      - name: Bundle Winetricks
        run: |
          curl -L -o LVNM.AppDir/usr/bin/tools/winetricks https://raw.githubusercontent.com/Winetricks/winetricks/master/src/winetricks
          chmod +x LVNM.AppDir/usr/bin/tools/*

      - name: Finalize AppDir Metadata
        run: |
          # Use your icon
          if [ -f icon.png ]; then cp icon.png LVNM.AppDir/lvnm.png; fi
          
          cat <<EOF > LVNM.AppDir/lvnm.desktop
          [Desktop Entry]
          Name=LVNM
          Exec=LVNM
          Icon=lvnm
          Type=Application
          Categories=Game;Utility;
          EOF

          cd LVNM.AppDir
          ln -s usr/bin/LVNM AppRun
          cd ..

      - name: Generate AppImage
        run: |
          curl -fLo appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool          
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run LVNM.AppDir/ LVNM-x86_64.AppImage

      - name: Upload Artifact (Always)
        uses: actions/upload-artifact@v4
        with:
          name: LVNM-x86_64.AppImage
          path: LVNM-x86_64.AppImage

      - name: Set Release Variables
        id: vars
        run: |
          if [ "${{ github.ref_type }}" == "tag" ]; then
            # If triggered by a tag (e.g., v1.0.0), set up a stable release
            echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_ENV
            echo "RELEASE_NAME=LVNM ${{ github.ref_name }}" >> $GITHUB_ENV
            echo "IS_PRERELEASE=false" >> $GITHUB_ENV
          else
            # If triggered by a branch push, set up the continuous rolling release
            echo "TAG_NAME=continuous" >> $GITHUB_ENV
            echo "RELEASE_NAME=Continuous Build" >> $GITHUB_ENV
            echo "IS_PRERELEASE=true" >> $GITHUB_ENV
          fi

      - name: Move Continuous Tag
        if: github.ref_type == 'branch'
        run: |
          # Force the 'continuous' git tag to move to the latest commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f continuous
          git push -f origin continuous

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated build for commit: ${{ github.sha }}
            Download the latest AppImage below.
          files: |
            LVNM-x86_64.AppImage
            LVNM-x86_64.AppImage.sha256
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}