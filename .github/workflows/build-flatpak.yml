name: Build LVNM Flatpak

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-flatpak:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install SDK, PySide base, graphics and codecs
        run: |
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.11 \
            org.kde.Sdk//6.11 \
            io.qt.PySide.BaseApp//6.11 \
            org.freedesktop.Platform.codecs-extra//25.08-extra \
            org.freedesktop.Platform.Compat.i386//25.08 \
            org.freedesktop.Platform.GL32.default//25.08 \
            org.freedesktop.Platform.GL32.default//25.08-extra \
            org.freedesktop.Platform.codecs_extra.i386//25.08-extra \
            org.freedesktop.Platform.VulkanLayer.gamescope//25.08

      - name: Build Flatpak repository
        run: |
          flatpak-builder --user --force-clean --repo=flatpak-repo \
            --install-deps-from=flathub flatpak-build \
            flatpak/io.github.uunniiblog.lvnm.yml

      - name: Create Flatpak bundle
        run: |
          flatpak build-bundle flatpak-repo LVNM-x86_64.flatpak \
            io.github.uunniiblog.lvnm \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Upload Flatpak artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: LVNM-x86_64.flatpak
          if-no-files-found: error
